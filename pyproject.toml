[project]
name = "microstation-mcp"
version = "2.0.0"
description = "MCP server đọc/ghi và KCS bản đồ địa chính TT 26/2024 cho MicroStation V8i"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0", "pywin32>=306", "pillow>=10", "shapely>=2.0", "psutil>=5.9"]

[project.scripts]
microstation-mcp = "src.main:main"
